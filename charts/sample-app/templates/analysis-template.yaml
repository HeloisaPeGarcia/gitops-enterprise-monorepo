apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "sample-app.fullname" . }}-success-rate
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name
    - name: prometheus-url
      value: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
  metrics:
    - name: success-rate
      interval: 10s
      successCondition: result[0] >= 0.95
      failureLimit: 3
      provider:
        prometheus:
          address: "{{ `{{` }} args.prometheus-url {{ `}}` }}"
          query: |
            sum(
              rate(
                nginx_ingress_controller_requests{
                  status=~"2[0-9]{2}",
                  exported_service="{{ `{{` }} args.service-name {{ `}}` }}"
                }[2m]
              )
            )
            /
            sum(
              rate(
                nginx_ingress_controller_requests{
                  exported_service="{{ `{{` }} args.service-name {{ `}}` }}"
                }[2m]
              )
            )
