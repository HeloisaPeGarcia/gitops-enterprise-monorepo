name: GitOps CI

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'platform/**'
      - 'applications/**'
      - 'argocd/**'
      - 'environments/**'
      - 'iac/**'
      - '.github/workflows/gitops-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'platform/**'
      - 'applications/**'
      - 'argocd/**'
      - 'environments/**'
      - 'iac/**'
      - '.github/workflows/gitops-ci.yml'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint charts/sample-app

      - name: YAML syntax validation
        run: |
          find platform applications argocd -name "*.yaml" -type f | xargs -I {} yq eval '{}' > /dev/null

      - name: Kubeconform (schema validation)
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          helm template charts/sample-app -f environments/prod/values.yaml | ./kubeconform -strict -summary -ignore-missing-schemas
          find platform applications -name "*.yaml" -type f | xargs ./kubeconform -strict -summary -ignore-missing-schemas

  security-and-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy (misconfiguration scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  iac-validate:
    runs-on: ubuntu-latest
    if: |
      contains(join(github.event.commits.*.modified, ' '), 'iac/') ||
      contains(join(github.event.pull_request.files.*.filename, ' '), 'iac/')
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Install Terragrunt
        run: |
          TGVER=$(curl -s https://api.github.com/repos/gruntwork-io/terragrunt/releases/latest | grep tag_name | cut -d '"' -f4)
          wget -qO /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/${TGVER}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Terraform fmt check
        run: terraform fmt -check -recursive iac/

      - name: Terraform validate (bootstrap module)
        run: |
          cd iac/bootstrap
          terraform init -backend=false
          terraform validate
